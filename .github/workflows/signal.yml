name: Bitcoin-Signal

on:
  schedule:
    - cron: '15 7 * * *'   # täglich 07:15 UTC (08:15 Uhr MEZ)
  workflow_dispatch:
    inputs:
      test:
        description: 'Test-Benachrichtigung senden'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Signal berechnen und ggf. melden
        run: node signal/check.mjs
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST: ${{ inputs.test }}
